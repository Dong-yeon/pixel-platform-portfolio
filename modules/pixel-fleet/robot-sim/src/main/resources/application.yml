spring:
  application:
    name: robot-sim
  main:
    web-application-type: none

sim:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:robot-sim}
  tick-interval-ms: 1000
  speed: 1.5                 # map units advanced per tick while moving
  battery-drain-per-tick: 0.4   # % drained per moving tick
  charge-per-tick: 2.0          # % recovered per charging tick
  # 이 값 아래로 떨어지면 유휴 로봇이 도크로 복귀한다.
  # **관제 서버의 배차 최소 배터리(NearestBatteryAwareAssignmentPolicy.MIN_BATTERY_PERCENT=25)보다
  # 높아야 한다.** 낮으면 그 사이 구간에 빠진 로봇이 영원히 멈춘다 — 배차받기엔 낮고,
  # 충전 가기엔 높고, IDLE에선 배터리가 닳지도 않아 스스로 빠져나올 수 없다.
  low-battery-threshold: 30
  # 이동 tick마다의 실패 확률. 한 작업이 40여 tick이라 0.02면 절반 넘게 실패해
  # 재시도 churn이 심하고 로봇이 계속 멈춘다. 재시도 경로는 여전히 보여주되 드물게.
  failure-rate: 0.003
  # 유휴 순찰은 기본으로 끈다. 서버가 구간 점유로 교통을 통제하는데, 로봇이 제멋대로
  # 돌아다니면 통제 밖 이동이 생겨 충돌 회피 보장이 깨진다.
  roam: false
  # 랙 피더가 렉 앞에서 멈춰 취출을 표현하는 시간(P21). 화물 엘리베이터의 승강 시간(fleet
  # elevatorTravelSeconds=12초)과 같은 패턴이나, 렉은 훨씬 가까운 거리라 더 짧게 잡았다.
  rack:
    fetch-seconds: 8
  obstacle:
    # P20-4 — 통로가 막히는 상황을 만든다(ObstacleSimulator). false면 데모에서 끌 수 있다.
    enabled: true
    check-interval-ms: 10000
    # 막힌 게 없을 때, 매 체크마다 새로 하나 막을 확률.
    spawn-probability: 0.3
    min-duration-seconds: 20
    max-duration-seconds: 40
  # 로봇은 층을 오가지 못한다(창고동 엘리베이터는 화물용이라 물건만 태운다).
  # 그래서 층은 배치다 — **관제 서버 robots.floor_no(V5 마이그레이션)와 같아야 한다.**
  #
  # P22: AMR/AGV 분리 — 창고동 1층 안쪽(랙·입고장·피킹존·출하장)은 AGV 전용, 그 밖(생산동·
  # 품질동·창고동 2·3층)은 AMR 전용이다. 그래서 1층 AMR의 집은 이제 창고동 도크가 아니라
  # 생산동 도크(PROD-DOCK-*)다 — AMR은 창고동에 못 들어가므로 그 도크를 쓸 수 없다.
  robots:
    - code: AMR-01
      name: 1호기
      home: PROD-DOCK-1
      floor: 1
    - code: AMR-02
      name: 2호기
      home: PROD-DOCK-2
      floor: 1
    - code: AMR-03
      name: 3호기
      home: PROD-DOCK-3
      floor: 1
    - code: AMR-04
      name: 4호기
      home: PROD-DOCK-4
      floor: 1
    - code: AMR-05
      name: 5호기
      home: WH-DOCK-2F
      floor: 2
    - code: AMR-06
      name: 6호기
      home: WH-DOCK-3F
      floor: 3
    # 위층 증차분 — 층간 이송이 늘면서 층당 1대가 병목이 됐다(fleet V6과 짝).
    # 도크는 층에 하나라 같은 집을 쓴다 — 정차 자리는 spot()이 세로로 줄 세워 갈라 준다.
    # 위층 충전 베이는 층마다 하나뿐이라 집을 같이 쓴다 — 정차 슬롯이 앞뒤로 갈라 세운다.
    # P22 범위 밖 — 창고동 2·3층은 그대로 AMR이 담당한다(P21 D10).
    - code: AMR-07
      name: 7호기
      home: WH-DOCK-2F
      floor: 2
    - code: AMR-08
      name: 8호기
      home: WH-DOCK-3F
      floor: 3
    # AGV(P21에서 신설, P22에서 랙 피더→AGV로 이름과 담당 구역을 넓혔다) — 창고동 1층
    # 안쪽 전체(렉·입고장·피킹존·출하장)를 담당한다. AMR의 레인망을 타지 않으므로(fleet
    # OrderService.planLeg가 로컬 직선 이동으로 계산) home은 창고동 도크다 — 관제 서버
    # robots.zone_code(V10/V11 마이그레이션)와 같아야 한다.
    - code: AGV-01
      name: 1층 AGV 1호
      home: WH-DOCK-1
      floor: 1
      type: AGV
    - code: AGV-02
      name: 1층 AGV 2호
      home: WH-DOCK-2
      floor: 1
      type: AGV
    # P22 범위 밖 — 창고동 2·3층 AGV는 그대로 좁은 존(P21 D10) 배치를 유지한다.
    - code: AGV-03
      name: 2층 AGV 1호
      home: WH-2F-P1
      floor: 2
      type: AGV
    - code: AGV-04
      name: 2층 AGV 2호
      home: WH-2F-P2
      floor: 2
      type: AGV
    - code: AGV-05
      name: 3층 AGV 1호
      home: WH-3F-P1
      floor: 3
      type: AGV
    - code: AGV-06
      name: 3층 AGV 2호
      home: WH-3F-P2
      floor: 3
      type: AGV

logging:
  level:
    com.pixelfleet.sim: info

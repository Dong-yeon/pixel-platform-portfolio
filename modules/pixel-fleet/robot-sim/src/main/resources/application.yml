spring:
  application:
    name: robot-sim
  main:
    web-application-type: none

sim:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:robot-sim}
  tick-interval-ms: 1000
  speed: 1.5                 # map units advanced per tick while moving
  battery-drain-per-tick: 0.4   # % drained per moving tick
  charge-per-tick: 2.0          # % recovered per charging tick
  # 이 값 아래로 떨어지면 유휴 로봇이 도크로 복귀한다.
  # **관제 서버의 배차 최소 배터리(NearestBatteryAwareAssignmentPolicy.MIN_BATTERY_PERCENT=25)보다
  # 높아야 한다.** 낮으면 그 사이 구간에 빠진 로봇이 영원히 멈춘다 — 배차받기엔 낮고,
  # 충전 가기엔 높고, IDLE에선 배터리가 닳지도 않아 스스로 빠져나올 수 없다.
  low-battery-threshold: 30
  # 이동 tick마다의 실패 확률. 한 작업이 40여 tick이라 0.02면 절반 넘게 실패해
  # 재시도 churn이 심하고 로봇이 계속 멈춘다. 재시도 경로는 여전히 보여주되 드물게.
  failure-rate: 0.003
  # 유휴 순찰은 기본으로 끈다. 서버가 구간 점유로 교통을 통제하는데, 로봇이 제멋대로
  # 돌아다니면 통제 밖 이동이 생겨 충돌 회피 보장이 깨진다.
  roam: false
  # 로봇은 층을 오가지 못한다(창고동 엘리베이터는 화물용이라 물건만 태운다).
  # 그래서 층은 배치다 — **관제 서버 robots.floor_no(V5 마이그레이션)와 같아야 한다.**
  # 1층은 창고·생산·품질을 다 돌아야 하므로 4대, 위층은 그 층 안에서만 일하므로 1대씩.
  robots:
    - code: AMR-01
      name: 1호기
      home: WH-DOCK-1
      floor: 1
    - code: AMR-02
      name: 2호기
      home: WH-DOCK-2
      floor: 1
    - code: AMR-03
      name: 3호기
      home: WH-DOCK-3
      floor: 1
    - code: AMR-04
      name: 4호기
      home: WH-DOCK-4
      floor: 1
    - code: AMR-05
      name: 5호기
      home: WH-DOCK-2F
      floor: 2
    - code: AMR-06
      name: 6호기
      home: WH-DOCK-3F
      floor: 3
    # 위층 증차분 — 층간 이송이 늘면서 층당 1대가 병목이 됐다(fleet V6과 짝).
    # 도크는 층에 하나라 같은 집을 쓴다 — 정차 자리는 spot()이 세로로 줄 세워 갈라 준다.
    # 위층 충전 베이는 층마다 하나뿐이라 집을 같이 쓴다 — 정차 슬롯이 앞뒤로 갈라 세운다.
    - code: AMR-07
      name: 7호기
      home: WH-DOCK-2F
      floor: 2
    - code: AMR-08
      name: 8호기
      home: WH-DOCK-3F
      floor: 3

logging:
  level:
    com.pixelfleet.sim: info

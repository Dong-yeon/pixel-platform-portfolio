spring:
  application:
    name: control-service
  profiles:
    active: local
  data:
    redis:
      # Railway provides REDIS_URL (redis://user:pass@host:port); local falls back to localhost.
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false   # we use RedisTemplate/pub-sub, not Spring Data Redis repositories

server:
  # Pixel Platform은 9000번대를 쓴다 (gateway 9000 / factory 9001 / fleet 9002).
  # Railway 등 배포 환경은 PORT를 주입한다.
  port: ${PORT:9002}
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  # 플랫폼 단일 서명 키 — gateway / pixel-factory / pixel-fleet이 같은 값을 써야
  # 한 번 로그인한 토큰이 플랫폼 전체에서 통한다(모듈별 키면 모듈마다 로그인해야 한다).
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: 120

mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  # cleanSession=false 로 붙으므로 clientId 가 세션 키다 — 같은 id 로 두 인스턴스를 띄우면
  # 서로 밀어낸다. 로컬에서 여러 개 띄울 때는 MQTT_CLIENT_ID 로 구분할 것.
  client-id: ${MQTT_CLIENT_ID:control-service}
  topic-filter: "fleet/#"

layout:
  # 공장 평면도는 pixel-factory 가 소유한다. 여기서 받아 캐시하고, 못 받으면
  # LocationRegistry 의 하드코딩 폴백으로 동작한다(WARN 남김).
  #
  # **게이트웨이를 경유하지 않고 모듈에 직접 붙는다** — 게이트웨이는 인증을 요구하는데
  # 서비스 간 인증(M2M)이 아직 없다. factory 가 이 엔드포인트만 열어 두었다.
  url: ${LAYOUT_URL:http://localhost:9001/api/layout}
  # 노드는 자주 안 바뀐다. 기동 시 실패한 경우의 복구도 이 주기가 겸한다.
  refresh-interval-ms: ${LAYOUT_REFRESH_INTERVAL_MS:300000}

demo:
  task-generator:
    # 데모용 운송 작업 자동 생성. 교통 통제 도입으로 로봇 자율 순찰을 껐기 때문에,
    # 이게 없으면 작업이 없을 때 로봇이 멈춰 있다.
    enabled: ${DEMO_TASK_GENERATOR_ENABLED:true}
    interval-ms: ${DEMO_TASK_GENERATOR_INTERVAL_MS:8000}

dispatch:
  # Automatic dispatch: drains pending tasks to available robots on a fixed delay.
  # Set enabled=false to dispatch only via POST /api/tasks/dispatch.
  enabled: ${DISPATCH_ENABLED:true}
  interval-ms: ${DISPATCH_INTERVAL_MS:2000}
  # P20-5 — nearest(직선거리, 기본) | graph-cost(장애물 반영한 실제 경로 비용).
  # graph-cost로 바꾸면 GraphCostAwareAssignmentPolicy가 뜬다. 회귀 시 nearest로 즉시 롤백.
  policy: ${DISPATCH_POLICY:nearest}
  watchdog:
    # 진행이 멈춘 작업을 걷어낸다. 없으면 로봇이 놓친 지시 하나가 레인 구간을 영원히
    # 점유해 함대 전체가 멈춘다(배포 중 실제로 발생).
    enabled: ${DISPATCH_WATCHDOG_ENABLED:true}
    interval-ms: ${DISPATCH_WATCHDOG_INTERVAL_MS:10000}
    ack-timeout-seconds: ${DISPATCH_WATCHDOG_ACK_TIMEOUT:30}
    run-timeout-seconds: ${DISPATCH_WATCHDOG_RUN_TIMEOUT:300}

fleet:
  events:
    retention:
      # fleet_events는 로봇 텔레메트리라 factory_events보다도 더 빨리 쌓인다(초당 발행).
      # 근거·기본값은 factory 쪽과 동일 — docs/BACKLOG.md "이벤트 보존 정책".
      enabled: ${FLEET_EVENT_RETENTION_ENABLED:true}
      days: ${FLEET_EVENT_RETENTION_DAYS:90}
      cron: ${FLEET_EVENT_RETENTION_CRON:0 15 3 * * *}

dashboard:
  # /ws/fleet STOMP 핸드셰이크가 허용할 오리진. 게이트웨이의 globalcors(P16)와
  # 같은 이름·같은 기본값을 쓴다 — SockJS 핸드셰이크는 globalcors를 안 거치고 모듈이
  # 직접 처리하므로 값이 어긋나면 게이트웨이는 통과시켜도 여기서 막힌다.
  origin: ${DASHBOARD_ORIGIN:http://localhost:9200}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pixelfleet
    username: fleet
    password: fleet
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # TODO: Inject dev database settings through deployment environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixelfleet}
    username: ${SPRING_DATASOURCE_USERNAME:fleet}
    password: ${SPRING_DATASOURCE_PASSWORD:fleet}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: false

jwt:
  # 배포 환경에서는 gateway·factory·fleet 세 서비스에 같은 PLATFORM_JWT_SECRET을 넣는다.
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-dev-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:control-service}
  topic-filter: "fleet/#"

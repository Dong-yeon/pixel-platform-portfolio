spring:
  application:
    name: control-service
  profiles:
    active: local
  data:
    redis:
      # Railway provides REDIS_URL (redis://user:pass@host:port); local falls back to localhost.
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false   # we use RedisTemplate/pub-sub, not Spring Data Redis repositories

server:
  # Pixel Platform은 9000번대를 쓴다 (gateway 9000 / factory 9001 / fleet 9002).
  # Railway 등 배포 환경은 PORT를 주입한다.
  port: ${PORT:9002}
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  # TODO: Move this value to an environment variable or Secret Manager outside local development.
  secret: "pixel-fleet-local-jwt-secret-key-must-be-at-least-32-bytes"
  access-token-expiration-minutes: 120

mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: control-service
  topic-filter: "fleet/#"

demo:
  task-generator:
    # 데모용 운송 작업 자동 생성. 교통 통제 도입으로 로봇 자율 순찰을 껐기 때문에,
    # 이게 없으면 작업이 없을 때 로봇이 멈춰 있다.
    enabled: ${DEMO_TASK_GENERATOR_ENABLED:true}
    interval-ms: ${DEMO_TASK_GENERATOR_INTERVAL_MS:15000}

dispatch:
  # Automatic dispatch: drains pending tasks to available robots on a fixed delay.
  # Set enabled=false to dispatch only via POST /api/tasks/dispatch.
  enabled: ${DISPATCH_ENABLED:true}
  interval-ms: ${DISPATCH_INTERVAL_MS:2000}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pixelfleet
    username: fleet
    password: fleet
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # TODO: Inject dev database settings through deployment environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixelfleet}
    username: ${SPRING_DATASOURCE_USERNAME:fleet}
    password: ${SPRING_DATASOURCE_PASSWORD:fleet}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: false

jwt:
  secret: ${JWT_SECRET:pixel-fleet-dev-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:control-service}
  topic-filter: "fleet/#"

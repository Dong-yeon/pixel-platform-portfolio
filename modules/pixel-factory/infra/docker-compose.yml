services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelfactory-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pixelfactory
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: pixel
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixelfactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pixelfactory-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 5

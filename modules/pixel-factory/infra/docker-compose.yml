# ⚠️ 플랫폼에서는 이 파일을 쓰지 않는다 — 루트 `infra/docker-compose.yml`을 쓸 것.
#    이 모듈만 단독으로 돌릴 때를 위해 남겨둔 파일이다. 호스트 포트(5432/1883)를
#    pixel-fleet 및 플랫폼 infra와 공유하므로 **동시에 띄우면 포트 충돌**한다.
name: pixelfactory

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelfactory-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pixelfactory
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: pixel
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixelfactory"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pixelfactory-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 | grep -q ."]
      interval: 10s
      timeout: 5s
      retries: 5

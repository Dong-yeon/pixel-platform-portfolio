spring:
  application:
    name: oee-service
  profiles:
    active: local

server:
  # Pixel Platform은 9000번대를 쓴다 (gateway 9000 / factory 9001 / fleet 9002).
  # Railway 등 배포 환경은 PORT를 주입한다.
  port: ${PORT:9001}
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  # 플랫폼 단일 서명 키 — gateway / pixel-factory / pixel-fleet이 같은 값을 써야
  # 한 번 로그인한 토큰이 플랫폼 전체에서 통한다(모듈별 키면 모듈마다 로그인해야 한다).
  # pixel-factory는 현재 플랫폼의 인증 담당(users 마스터)이라 발급도 여기서 한다.
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: 120

mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  # cleanSession=false 로 붙으므로 clientId 가 세션 키다 — 같은 id 로 두 인스턴스를 띄우면
  # 서로 밀어낸다. 로컬에서 여러 개 띄울 때는 MQTT_CLIENT_ID 로 구분할 것.
  client-id: ${MQTT_CLIENT_ID:oee-service}
  topic-filter: "factory/#"

pop:
  # POP 단말 presence(파생 위치) 타임아웃(분). 마지막 조작 후 이 시간이 지나면 지도 배지를 뗀다.
  # 데모/검증 시 짧게 낮춰 stale 처리를 눈으로 확인할 수 있다(POP_PRESENCE_TIMEOUT_MINUTES).
  presence-timeout-minutes: ${POP_PRESENCE_TIMEOUT_MINUTES:30}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pixelfactory
    username: pixel
    password: pixel
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # TODO: Inject dev database settings through deployment environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixelfactory}
    username: ${SPRING_DATASOURCE_USERNAME:pixel}
    password: ${SPRING_DATASOURCE_PASSWORD:pixel}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: false

jwt:
  # 배포 환경에서는 gateway·factory·fleet 세 서비스에 같은 PLATFORM_JWT_SECRET을 넣는다.
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-dev-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:oee-service}
  topic-filter: "factory/#"

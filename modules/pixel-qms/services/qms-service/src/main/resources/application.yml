spring:
  application:
    name: qms-service
  profiles:
    active: local

server:
  # gateway 9000 / factory 9001 / fleet 9002 / wms 9003 / qms 9004
  port: ${PORT:9004}
  servlet:
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: 120

mqtt:
  enabled: true
  broker-url: tcp://localhost:1883
  client-id: ${MQTT_CLIENT_ID:qms-service}
  # factory가 발행하는 품질 신호(검사 요청)를 구독한다. factory는 QMS를 모른다.
  topic-filter: "factory/quality/#"

factory:
  # MRB 홀드/해제를 factory에 요청한다. 서비스 간 인증(M2M)이 없어 모듈에 직접 붙는다.
  base-url: ${FACTORY_BASE_URL:http://localhost:9001}

qms:
  notification:
    # 실제 SMTP 대신 발송함(Outbox)에 쌓는다 — 배포 환경에서 포트가 막히고 데모 재현이 안 된다.
    # smtp 로 바꾸면 SmtpSender 를 쓴다(아직 미구현 — 확장점만 열어 둔다).
    sender: ${QMS_NOTIFICATION_SENDER:outbox}
    quality-team-address: ${QMS_QUALITY_TEAM_ADDRESS:quality@pixelfactory.local}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/pixelqms
    username: qms
    password: qms
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pixelqms}
    username: ${SPRING_DATASOURCE_USERNAME:qms}
    password: ${SPRING_DATASOURCE_PASSWORD:qms}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    open-in-view: false
    show-sql: false

jwt:
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-dev-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:qms-service}
  topic-filter: "factory/quality/#"

factory:
  base-url: ${FACTORY_BASE_URL:http://localhost:9001}

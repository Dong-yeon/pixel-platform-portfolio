plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.pixelplatform'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 소스는 UTF-8이지만 javac는 플랫폼 기본 인코딩(한국어 Windows면 cp949)으로 읽는다.
// 지정하지 않으면 한글 문자열 리터럴이 **컴파일 시점에** 깨진다 — 파일은 멀쩡한데
// 실행하면 응답·로그의 한글이 모지바케가 된다(실제로 그렇게 나갔다).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// Spring Cloud BOM — 3.3.x 라인은 Spring Cloud 2023.0.x 와 맞춘다.
ext {
    springCloudVersion = '2023.0.3'
}

dependencies {
    // Gateway는 WebFlux(리액티브) 기반이다. spring-boot-starter-web(서블릿)을 넣으면
    // 서블릿 스택으로 뜨면서 게이트웨이가 동작하지 않으니 추가하지 말 것.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

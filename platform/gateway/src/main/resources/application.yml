spring:
  application:
    name: gateway
  cloud:
    gateway:
      # 하위 모듈도 CORS 헤더를 붙이는 경우가 있어(fleet의 WebSocketConfig 등)
      # 게이트웨이 것과 합쳐지면 헤더가 중복된다. 브라우저는 Access-Control-Allow-Origin이
      # 두 개면 요청을 거부하므로(curl은 통과) 응답 헤더를 하나로 정리한다.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # 모듈은 자기 경로(/api/robots …)만 알고, 플랫폼 접두사(/api/fleet/…)는 모른다.
      # 따라서 게이트웨이가 접두사를 떼고 전달한다(RewritePath).
      routes:
        # 플랫폼 인증 창구. 로그인은 여기 하나뿐이고, 발급된 토큰은 모든 모듈에서 통한다
        # (서명 키를 공유하므로). 게이트웨이는 사용자 저장소가 없어 발급을 못 하므로
        # 신원 담당 모듈에 위임한다 — 어느 모듈이 담당인지는 설정으로 드러낸다.
        - id: platform-auth
          uri: ${AUTH_MODULE_URI:http://localhost:9001}
          predicates:
            - Path=/api/auth/**

        - id: pixel-factory
          uri: ${MODULE_FACTORY_URI:http://localhost:9001}
          predicates:
            - Path=/api/factory/**
          filters:
            - RewritePath=/api/factory/(?<segment>.*), /api/$\{segment}

        - id: pixel-fleet
          uri: ${MODULE_FLEET_URI:http://localhost:9002}
          predicates:
            - Path=/api/fleet/**
          filters:
            - RewritePath=/api/fleet/(?<segment>.*), /api/$\{segment}

        - id: pixel-wms
          uri: ${MODULE_WMS_URI:http://localhost:9003}
          predicates:
            - Path=/api/wms/**
          filters:
            - RewritePath=/api/wms/(?<segment>.*), /api/$\{segment}

        - id: pixel-qms
          uri: ${MODULE_QMS_URI:http://localhost:9004}
          predicates:
            - Path=/api/qms/**
          filters:
            - RewritePath=/api/qms/(?<segment>.*), /api/$\{segment}

        # 실시간 push(STOMP over SockJS). 경로 재작성 없이 그대로 넘긴다.
        #
        # **모듈마다 경로가 다르다.** 예전엔 /ws/** 를 통째로 fleet으로 보냈는데, 그러면
        # factory가 WebSocket을 열 자리가 없다(모듈이 늘어나면 더 막힌다).
        # 서버 쪽 엔드포인트도 같은 경로다(fleet WebSocketConfig=/ws/fleet, factory=/ws/factory).
        #
        # uri는 반드시 http:// 로 둔다 — 게이트웨이가 Upgrade 헤더를 보고 자동으로 ws 로
        # 전환하며, SockJS의 /info 와 XHR 폴백(일반 HTTP)도 같은 라우트로 통과시킨다.
        # ws:// 로 두면 업그레이드가 아닌 요청이 400으로 거부된다.
        #
        # SockJS는 /ws/{module}/info, /ws/{module}/{server}/{session}/xhr 처럼 하위 경로를
        # 전부 쓰므로 라우트가 그 아래를 다 잡아야 한다.
        - id: pixel-fleet-ws
          uri: ${MODULE_FLEET_WS_URI:http://localhost:9002}
          predicates:
            - Path=/ws/fleet/**

        - id: pixel-factory-ws
          uri: ${MODULE_FACTORY_WS_URI:http://localhost:9001}
          predicates:
            - Path=/ws/factory/**

      # 대시보드(9200)는 다른 오리진이므로 게이트웨이에서 CORS를 한 곳에 모아 처리한다.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"   # TODO: 배포 전 실제 대시보드 오리진으로 제한
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

# 플랫폼 단일 서명 키 — gateway / pixel-factory / pixel-fleet이 **같은 값**을 써야 한다.
# 하나라도 다르면 게이트웨이가 통과시킨 토큰을 모듈이 거부해 전 화면이 401이 된다.
jwt:
  secret: ${PLATFORM_JWT_SECRET:pixel-platform-local-jwt-secret-key-must-be-at-least-32-bytes}

server:
  port: ${PORT:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: info

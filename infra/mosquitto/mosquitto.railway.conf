# Railway 배포용 브로커 설정.
#
# 로컬(mosquitto.conf)과 다른 점: bind 주소를 지정하지 않는다.
# Railway 프라이빗 네트워크는 IPv6로 통신하므로 0.0.0.0(IPv4 전용)으로 묶으면
# 다른 서비스가 붙지 못한다. 주소를 생략하면 IPv4/IPv6 전체에 바인딩된다.
listener 1883
allow_anonymous true

# 로컬과 같은 이유로 영속화를 켠다(브로커 재시작 시 큐·retained 유실 방지).
# 주의: Railway 컨테이너 파일시스템은 재배포마다 초기화된다. 재배포를 넘겨 보존하려면
# /mosquitto/data 에 볼륨을 붙여야 한다 — 안 붙이면 재배포 시점에는 여전히 사라진다.
persistence true
persistence_location /mosquitto/data/

# 오프라인 세션 큐 상한. 기본값 1000은 4분치도 안 되고, 넘치면 조용히 버린다.
# 유한 버퍼임을 잊지 말 것 — 100000건이면 현재 발행률로 약 7시간치다.
max_queued_messages 100000

# TODO: 퍼블릭 노출이 필요해지면 반드시 인증(비밀번호 파일 + ACL)을 켤 것.
#       현재는 Railway 프라이빗 네트워크 안에서만 접근 가능하다는 전제다.

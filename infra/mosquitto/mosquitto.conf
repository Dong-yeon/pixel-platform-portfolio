# Platform-wide development broker.
# Modules share this broker and stay separated by topic namespace:
#   factory/{lineCode}/{equipmentCode}/{kind}   — pixel-factory
#   fleet/{robotCode}/{kind|command}            — pixel-fleet
# TODO: Enable authentication + per-module ACLs before deploying beyond local/demo.
listener 1883 0.0.0.0
allow_anonymous true

# 영속화를 켠다. 끄면 브로커 재시작 때 큐잉된 메시지와 retained 상태가 통째로 사라진다 —
# 구독자가 cleanSession=false 로 붙어도 브로커 쪽에 남은 게 없으면 소용없다.
# 이벤트가 단일 진실 공급원인 구조에서 유실은 곧 OEE 구간에 구멍이 된다.
persistence true
persistence_location /mosquitto/data/

# 오프라인 세션에 쌓아 둘 메시지 상한. **기본값 1000은 너무 작다** — 설비 8대가
# 초당 3~4건을 내므로 4분만 내려가도 넘치고, 브로커는 조용히 버린다
# (로그에 "Outgoing messages are being dropped for client ..." 만 남는다. 실제로 겪었다).
#
# 이건 무한 내구성이 아니라 **유한 버퍼**다. 100000건이면 위 발행률로 약 7시간치다.
# 그보다 긴 장애는 여전히 유실되므로, 그때는 이벤트를 다시 받을 다른 경로가 필요하다.
max_queued_messages 100000

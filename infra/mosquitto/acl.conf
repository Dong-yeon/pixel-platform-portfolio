# 서비스별 토픽 접근 범위.
#
# 신뢰 경계는 이미 있던 토픽 네임스페이스 관례(factory/#, fleet/#,
# factory/quality/#, fleet/tasks/#)를 그대로 따른다 — 새로 지어내지 않는다.
# "모듈이 서로를 모른다"는 컴포저블 원칙이 여기서는 읽기 전용 경계로 나타난다:
# wms-service/qms-service는 자기 도메인 밖 어떤 토픽도 구독·발행할 수 없다.
#
# password_file에 없는 계정으로 접속을 시도하면 애초에 인증에서 막히므로,
# 여기 없는 user는 이 파일과 무관하게 접속 자체가 거부된다.

user factory-sim
topic write factory/#

user oee-service
topic read factory/#
topic write factory/quality/#

user control-service
topic read fleet/#
topic write fleet/#

user robot-sim
topic read fleet/#
topic write fleet/#

user wms-service
topic read fleet/tasks/#

user qms-service
topic read factory/quality/#

// 플랫폼 공통 코어 — 모듈들이 Gradle 복합 빌드(includeBuild)로 가져다 쓴다.
// 실행 가능한 앱이 아니라 라이브러리이므로 bootJar를 만들지 않는다.
plugins {
    id 'java-library'
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.pixelplatform'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 소스는 UTF-8이지만 javac는 플랫폼 기본 인코딩(한국어 Windows면 cp949)으로 읽는다.
// 지정하지 않으면 한글 문자열 리터럴이 **컴파일 시점에** 깨진다 — 파일은 멀쩡한데
// 실행하면 응답·로그의 한글이 모지바케가 된다(실제로 그렇게 나갔다).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.5"
    }
}

dependencies {
    // api = 이 라이브러리를 쓰는 모듈에도 그대로 노출된다(모듈이 Spring 타입을 직접 쓰므로).
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-web'

    api 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}
